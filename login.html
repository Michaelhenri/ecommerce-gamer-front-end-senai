<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMESTORE - login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-topo-gamer">
          <div class="container">
            <a class="navbar-brand fw-bold text-white d-flex align-items-center" href="index.html">
               <img src="img/logo.png" alt="Logo GameStore Pro" width="40" height="40" class="me-2"> GAMESTORE <span class="text-icon">PRO</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuGamer">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuGamer">
              <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link text-white px-3" href="index.html">HOME</a>
                <a class="nav-link text-white px-3" href="index.html#section-vendidos">PRODUTOS</a>
                <a class="nav-link text-icon px-3" href="login.html">LOGIN</a>
                <a class="nav-link text-white px-3" href="index.html#carrinho">
                  <i class="bi bi-cart3"></i> Carrinho (0)
                </a>
              </div>
            </div>
          </div>
        </nav> 
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
    
            <section id="section-login" class="col-12 col-md-4 ">
                <div class="bg-banner-gamer rounded p-4 border border-secondary shadow">
                    <h1 class="fw-bold text-white mb-4 fs-3">Login</h1>
    
                    <form method="post" action="" id="login">
                        <div class="mb-3">
                            <label for="usuario" class="form-label text-white-50">Nome:</label>
                            <input id="usuario" name="usuario" required="required" type="text"
                                placeholder="Insira o seu usuário"
                                class="form-control bg-dark text-white border-secondary" />
                        </div>
    
                        <div class="mb-3">
                            <label for="senha" class="form-label text-white-50">Senha:</label>
                            <input id="senha" name="senha" required="required" type="password"
                                placeholder="Insira a sua senha" class="form-control bg-dark text-white border-secondary" />
                        </div>
    
                        <div class="mt-4 mb-3">
                            <input type="button" value="Entrar" class="btn btn-gamer-neon w-100 fw-bold" id="bt-login"
                                onclick="login()" />
                        </div>
    
                        <div class="text-center mt-3">
                            <a href="#" id="link-ir-cadastro" class="text-icon text-decoration-none small fw-bold">Não é
                                cadastrado ainda? Cadastre-se</a>
                        </div>
                    </form>
                </div>
            </section>
    
            <section id="section-cadastro" class="col-12 col-md-4 escondido">
                <div class="bg-banner-gamer rounded p-4 border border-secondary shadow">
                    <h1 class="fw-bold text-white mb-2 fs-3">Criar minha conta</h1>
                    <p class="text-muted small mb-4">Informe os seus dados abaixo para criar sua conta.</p>
    
                    <form method="post" action="" id="cadastro">
                        <div class="mb-3">
                            <label for="usuario-cad" class="form-label text-white-50">Usuário:</label>
                            <input id="usuario-cad" name="usuario" required="required" type="text"
                                placeholder="ex. nome de usuário"
                                class="form-control bg-dark text-white border-secondary" />
                        </div>
    
                        <div class="mb-3">
                            <label for="email" class="form-label text-white-50">E-mail:</label>
                            <input id="email" name="email" required="required" type="email" placeholder="seu@email.com.br"
                                class="form-control bg-dark text-white border-secondary" />
                        </div>
    
                        <div class="mb-3">
                            <label for="senha-cad" class="form-label text-white-50">Senha:</label>
                            <input id="senha-cad" name="senha" required="required" type="password"
                                placeholder="mínimo de 6 caracteres"
                                class="form-control bg-dark text-white border-secondary" />
                        </div>
    
                        <div class="mt-4 mb-3">
                            <input type="button" value="Cadastrar" class="btn btn-gamer-neon w-100 fw-bold"
                                id="bt-cadastrar" onclick="cadastro()" />
                        </div>
    
                        <div class="text-center mt-3">
                            <a href="#" id="link-ir-login" class="text-icon text-decoration-none small fw-bold">Já tem uma
                                conta? Faça Login</a>
                        </div>
                    </form>
                </div>
            </section>
    
        </div>
    </main>

    <footer class="bg-topo-gamer text-center text-muted py-4 mt-5 border-top border-dark">
        <div class="container">
            <p class="mb-1 text-white fw-bold">GAMESTORE <span class="text-icon">PRO</span></p>
            <p class="mb-0 small">&copy; 2026 GS pro. Todos os direitos reservados. Desenvolvido para fins acadêmicos -
                SENAI.</p>
        </div>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3"
        crossorigin="anonymous"></script>
    
    <script src="https://code.jquery.com/jquery-3.6.1.js" integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI="
        crossorigin="anonymous"></script>
    
    <script src="js/script.js"></script>
    <script type="text/javascript" src="js/jquery-script.js"></script>

</body>

</html>
